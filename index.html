<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1e" />
  <meta name="description" content="Track your habits, conquer health anxiety, and build iron discipline — one day at a time." />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- FontAwesome 6 -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Open Graph -->
  <meta property="og:title"       content="Discipline Tracker" />
  <meta property="og:description" content="Your daily fortress against anxiety and in favour of discipline." />
  <meta property="og:type"        content="website" />

  <title>Discipline Tracker</title>
</head>
<body class="bg-navy-800">

  <!-- Splash / loading state -->
  <div id="app-splash"
    class="fixed inset-0 z-50 bg-navy-800 flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="w-16 h-16 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center mb-4"
         style="animation: pulseGlow 2s ease-in-out infinite;">
      <i class="fa-solid fa-brain text-2xl text-indigo-400"></i>
    </div>
    <p class="text-white font-semibold text-lg">Discipline Tracker</p>
    <p class="text-slate-400 text-sm mt-1">Loading your fortress...</p>
    <div class="mt-6 flex gap-1">
      <div class="w-2 h-2 rounded-full bg-indigo-500 animate-bounce" style="animation-delay:0s"></div>
      <div class="w-2 h-2 rounded-full bg-indigo-500 animate-bounce" style="animation-delay:0.15s"></div>
      <div class="w-2 h-2 rounded-full bg-indigo-500 animate-bounce" style="animation-delay:0.3s"></div>
    </div>
  </div>

  <!-- Main app mount point -->
  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>

  <script>
    // Hide splash once JS has loaded and the app has started mounting
    document.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('app-splash');
      // Small delay to let first render settle
      setTimeout(() => {
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 500);
        }
      }, 600);
    });
  </script>
</body>
</html>
