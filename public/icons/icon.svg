<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle border glow -->
  <rect width="512" height="512" rx="112" fill="none" stroke="#6366f1" stroke-width="10" opacity="0.35"/>

  <!-- Brain icon (simplified geometric) -->
  <!-- Left hemisphere -->
  <path d="M 180 170
    C 140 170, 110 198, 110 234
    C 110 252, 118 268, 131 280
    C 120 292, 114 308, 116 326
    C 118 352, 138 372, 162 374
    C 170 374, 178 372, 185 368
    L 185 310
    C 175 308, 168 300, 168 290
    C 168 280, 175 272, 185 270
    L 185 210
    C 182 202, 180 186, 180 170 Z"
    fill="url(#glow)" opacity="0.9"/>

  <!-- Right hemisphere -->
  <path d="M 332 170
    C 372 170, 402 198, 402 234
    C 402 252, 394 268, 381 280
    C 392 292, 398 308, 396 326
    C 394 352, 374 372, 350 374
    C 342 374, 334 372, 327 368
    L 327 310
    C 337 308, 344 300, 344 290
    C 344 280, 337 272, 327 270
    L 327 210
    C 330 202, 332 186, 332 170 Z"
    fill="url(#glow)" opacity="0.9"/>

  <!-- Center bridge / corpus callosum -->
  <rect x="185" y="238" width="142" height="22" rx="11" fill="url(#glow)" opacity="0.85"/>
  <rect x="195" y="292" width="122" height="18" rx="9" fill="url(#glow)" opacity="0.7"/>

  <!-- Top arc connecting hemispheres -->
  <path d="M 185 170 C 185 140, 200 128, 256 128 C 312 128, 327 140, 327 170"
    fill="none" stroke="url(#glow)" stroke-width="20" stroke-linecap="round" opacity="0.9"/>

  <!-- Neural spark dots -->
  <circle cx="256" cy="390" r="8" fill="#818cf8" opacity="0.6"/>
  <circle cx="230" cy="400" r="5" fill="#a5b4fc" opacity="0.4"/>
  <circle cx="282" cy="400" r="5" fill="#a5b4fc" opacity="0.4"/>
</svg>
